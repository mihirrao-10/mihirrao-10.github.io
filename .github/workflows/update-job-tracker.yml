name: Update new graduate job tracker

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-new-grad-job-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and generate job data
        run: npm run update:jobs

      - name: Validate generated data
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Run the production build
        run: npm run build

      - name: Detect generated-data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            new-grad-job-tracker-2027/data/jobs.json \
            new-grad-job-tracker-2027/data/archive.json \
            new-grad-job-tracker-2027/data/metadata.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated job data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            new-grad-job-tracker-2027/data/jobs.json \
            new-grad-job-tracker-2027/data/archive.json \
            new-grad-job-tracker-2027/data/metadata.json
          git commit -m "chore(job-tracker): refresh verified roles"
          git push
